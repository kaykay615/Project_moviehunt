<ion-header>
  <ion-toolbar color="black">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/index"></ion-back-button>
    </ion-buttons>
    <ion-title>Perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>

  <!-- SE ESTIVER LOGADO -->
  <div *ngIf="userData" class="logged-box">
    <h2>Olá, {{ userData.nome }}</h2>

    <ion-button color="danger" expand="block" (click)="logout()">
      Sair
    </ion-button>
  </div>

  <!-- SE NÃO ESTIVER LOGADO -->
  <div *ngIf="!userData" class="login-card">

    <div class="mode-toggle">
      <ion-button fill="clear" [color]="!showRegister ? 'primary' : 'medium'" (click)="toggleMode(false)">Entrar</ion-button>
      <ion-button fill="clear" [color]="showRegister ? 'primary' : 'medium'" (click)="toggleMode(true)">Criar conta</ion-button>
    </div>

    <div *ngIf="!showRegister">
      <ion-item>
        <ion-label position="stacked">E-mail</ion-label>
        <ion-input type="email" [(ngModel)]="email"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Senha</ion-label>
        <ion-input type="password" [(ngModel)]="password"></ion-input>
      </ion-item>

      <ion-button expand="block" color="primary" (click)="login()">Entrar</ion-button>
    </div>

    <div *ngIf="showRegister">

      <ion-item>
       <ion-label position="stacked">Nome</ion-label>
       <ion-input type="text" [(ngModel)]="regName"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">E-mail</ion-label>
        <ion-input type="email" [(ngModel)]="regEmail"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Senha</ion-label>
        <ion-input type="password" [(ngModel)]="regPassword"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="stacked">Confirmar senha</ion-label>
        <ion-input type="password" [(ngModel)]="regConfirmPassword"></ion-input>
      </ion-item>

      <ion-button expand="block" color="primary" (click)="createAccount()">Criar conta</ion-button>
    </div>

    <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>
  </div>
</ion-content>


<ion-tab-bar slot="bottom">

  <ion-tab-button tab="favoritos" routerLink="/favoritos">
    <ion-icon name="bookmark"></ion-icon>
    <ion-label>Favoritos</ion-label>
  </ion-tab-button>

  <ion-tab-button tab="home" routerLink="/home">
    <ion-icon name="home"></ion-icon>
    <ion-label>Home</ion-label>
  </ion-tab-button>

  <ion-tab-button tab="perfil" routerLink="/perfil">
    <ion-icon name="person"></ion-icon>
    <ion-label>Perfil</ion-label>
  </ion-tab-button>

  <ion-tab-button tab="perfil" routerLink="/sobre">
    <ion-icon name="information-circle-outline"></ion-icon>
    <ion-label>Sobre</ion-label>
  </ion-tab-button>

</ion-tab-bar>
